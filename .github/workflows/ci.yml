name: CI

on:
  push:
    branches:
      - feature/bukanpipe-homepage-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- tests/smoke/home.test.tsx
